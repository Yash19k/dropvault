[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web", "terraform", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "api", "auth", "deletion", "health", "links", "log", "ratelimit", "stats", "storage", "tokens", "usage", "validation", "visits", "analytics", "conftest"]

[tool.ruff.lint.per-file-ignores]
# inline-styled HTML templates (emails and link pages)
"endpoints/qr-link/src/qr_link.py" = ["E501"]
"endpoints/share-file/src/share_file.py" = ["E501"]
